name: Build and release

# Every push to main publishes a release. The app checks GitHub's latest release on launch,
# so this is the whole update mechanism - there is nothing else to deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: Stamp the version
        shell: pwsh
        env:
          VERSION: 1.0.${{ github.run_number }}
        run: |
          # The updater compares GitHub's latest tag against __version__, so a build that
          # forgot to stamp it would keep offering itself as an update forever.
          $file = "src/prayer_widget/__init__.py"
          (Get-Content $file) -replace '__version__ = ".*"', "__version__ = `"$env:VERSION`"" |
            Set-Content $file -Encoding utf8
          Select-String -Path $file -Pattern '__version__'

      - name: Build the executable
        run: pyinstaller build.spec --noconfirm

      - name: Verify Qt actually made it into the bundle
        shell: pwsh
        run: |
          # A spec that loses the Qt libraries still produces an exe and still exits 0.
          # The only honest check is to look inside it.
          $exe = "dist/IslamicNashatWidget.exe"
          if (-not (Test-Path $exe)) { throw "no executable was produced" }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host ("size: {0:N1} MB" -f $size)
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe))
          foreach ($lib in @('Qt6Core', 'Qt6Widgets', 'Qt6Multimedia')) {
            if (-not $text.Contains($lib)) { throw "$lib is missing from the bundle" }
            Write-Host "$lib present"
          }

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: v1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: dist/IslamicNashatWidget.exe
